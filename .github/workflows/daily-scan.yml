name: Kasdieninis kainų tikrinimas

on:
  push:
    branches:
      - main
  schedule:
    # 18:00 UTC ≈ 20:00 Vilnius (žiemos laikas), 21:00 (vasaros laikas)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Įdiegti priklausomybes
        run: npm ci

      - name: Tikrinti kainas (TEZ + kitų agentūrų nuorodos)
        run: npm run scan

      - name: Išsaugoti rezultatus repozitorijoje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/prices.json data/last-scan-summary.json
          if git diff --staged --quiet; then
            echo "Kainos nepasikeitė — commit nereikalingas."
          else
            git commit -m "Kasdieninis kainų skenavimas $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: El. laiškas tik kai kaina ≤ 400 €/asm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsx scripts/create-alert-issue.ts | tee /tmp/alert.log
          if grep -q "SKIP_ISSUE=1" /tmp/alert.log; then
            echo "Kainų virš 400 €/asm arba jų nėra — el. laiškas nesiunčiamas."
            exit 0
          fi
          gh issue create \
            --title "$(cat .github-alert-title.txt)" \
            --body-file .github-alert-body.md
