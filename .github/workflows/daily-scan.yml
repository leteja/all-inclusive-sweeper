name: Kasdieninis kainų tikrinimas

on:
  schedule:
    # 18:00 UTC ≈ 20:00 Vilnius (žiemos laikas), 21:00 (vasaros laikas)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Įdiegti priklausomybes
        run: npm ci

      - name: Tikrinti kainas (TEZ + kitų agentūrų nuorodos)
        run: npm run scan

      - name: Išsaugoti rezultatus repozitorijoje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/prices.json data/last-scan-summary.json
          if git diff --staged --quiet; then
            echo "Kainos nepasikeitė — commit nereikalingas."
          else
            git commit -m "Kasdieninis kainų skenavimas $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Sukurti GitHub Issue, jei rasta gera kaina
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HAS_ALERTS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/last-scan-summary.json','utf8')).hasAlerts)")
          if [ "$HAS_ALERTS" = "true" ]; then
            gh issue create \
              --title "🏖️ Kainų alertas — $(date -u +%Y-%m-%d)" \
              --body "Automatinis vakarinis skenavimas rado pasiūlymus jūsų biudžete arba kainų kritimą. Peržiūrėkite [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
              || echo "Nepavyko sukurti issue."
          fi
